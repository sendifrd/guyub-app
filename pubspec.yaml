name: guyub_app
description: Aplikasi Guyub untuk mahasiswa, dosen, ketua kelas, dan penjual.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  flutter_secure_storage: ^11.2.0
  google_fonts: ^6.2.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Huruf dibundel supaya aplikasi tidak perlu mengunduh font saat dibuka (dan tes bisa jalan offline).
  assets:
    - google_fonts/
